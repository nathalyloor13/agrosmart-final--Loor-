services:
  postgres:
    image: postgres:16-alpine
    container_name: agrosmart-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: agrosmart_db
      POSTGRES_USER: agrosmart_user
      POSTGRES_PASSWORD: AgroSmart2026!
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrosmart_user -d agrosmart_db"]
      interval: 3s
      timeout: 3s
      retries: 5


volumes:
  postgres-data: